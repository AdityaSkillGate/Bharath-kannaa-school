<app-hero-banner
  [badge]="bannerBadge"
  [title]="bannerTitle"
  [subtitle]="bannerSub"
  [breadcrumbs]="breadcrumbs">
</app-hero-banner>

<section class="section facilities-page-section">
  <div class="container">
    <app-page-header
      [badge]="pageBadge"
      [title]="pageTitle"
      [subtitle]="pageSub">
    </app-page-header>

    <div class="facilities-stack">
      @for (f of facilities; track f.id; let odd = $odd) {
        <div class="card facility-row-card" [class.reverse-row]="odd">
          <div class="facility-row-media img-zoom-container">
            <img [src]="f.imageUrl" [alt]="f.title" loading="lazy" />
          </div>

          <div class="facility-row-body">
            <span class="facility-pill">{{ langService.t('fac_page.pill') }}</span>
            <h3 class="facility-heading">{{ f.title }}</h3>
            <p class="facility-desc-main">{{ f.fullDesc }}</p>

            <div class="facility-features-grid">
              @for (feat of f.features; track feat) {
                <div class="f-feat-item">
                  <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                  <span>{{ feat }}</span>
                </div>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>

<!-- GREEN & ECO-FRIENDLY CAMPUS STRIP -->
<section class="section-sm eco-campus-section bg-light">
  <div class="container">
    <div class="card eco-card">
      <div class="eco-icon">🌿</div>
      <div class="eco-text">
        <h4>{{ langService.t('fac_page.eco_title') }}</h4>
        <p>
          {{ langService.t('fac_page.eco_desc') }}
        </p>
      </div>
    </div>
  </div>
</section>

<app-cta-section></app-cta-section>
