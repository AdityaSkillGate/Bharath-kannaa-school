<app-hero-banner
  [badge]="langService.t('video.banner_badge')"
  [title]="langService.t('video.banner_title')"
  [subtitle]="langService.t('video.banner_sub')"
  [breadcrumbs]="breadcrumbs">
</app-hero-banner>

<section class="section video-section">
  <div class="container">
    <div class="grid grid-3 video-grid">
      @for (video of videos; track video.id) {
        <div class="card video-card" (click)="playVideo(video)">
          <div class="video-thumb-wrapper img-zoom-container">
            <img [src]="video.thumbnailUrl" [alt]="video.title" loading="lazy" />
            <div class="play-btn-overlay">
              <div class="play-circle">
                <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              </div>
            </div>
            <span class="video-duration">{{ video.duration }}</span>
          </div>

          <div class="video-info">
            <span class="video-cat">{{ video.category }}</span>
            <h3 class="video-title">{{ video.title }}</h3>
          </div>
        </div>
      }
    </div>
  </div>
</section>

<!-- VIDEO MODAL PLAYER -->
@if (activeVideo) {
  <div class="modal-backdrop" (click)="closeVideoPlayer()">
    <div class="video-modal-dialog" (click)="$event.stopPropagation()">
      <div class="video-modal-header">
        <h4>{{ activeVideo.title }}</h4>
        <button type="button" class="close-video-btn" (click)="closeVideoPlayer()">&times;</button>
      </div>
      <div class="video-player-container">
        @if (safeVideoUrl) {
          <iframe
            [src]="safeVideoUrl"
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        }
      </div>
    </div>
  </div>
}

<app-cta-section></app-cta-section>
