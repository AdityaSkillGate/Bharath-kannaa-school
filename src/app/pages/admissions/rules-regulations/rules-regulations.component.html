<app-hero-banner
  [badge]="langService.t('rules.banner_badge')"
  [title]="langService.t('rules.banner_title')"
  [subtitle]="langService.t('rules.banner_sub')"
  [breadcrumbs]="breadcrumbs">
</app-hero-banner>

<section class="section rules-section">
  <div class="container">
    <app-page-header
      [badge]="langService.t('rules.standards_badge')"
      [title]="langService.t('rules.standards_title')"
      [subtitle]="langService.t('rules.standards_sub')">
    </app-page-header>

    <div class="grid grid-2 rules-grid">
      @for (cat of ruleCategories; track cat.title) {
        <div class="card rule-card">
          <div class="rule-header">
            <span class="rule-icon">{{ cat.icon }}</span>
            <h3 class="rule-cat-title">{{ cat.title }}</h3>
          </div>
          <ul class="rules-point-list">
            @for (p of cat.points; track p) {
              <li>
                <span class="rule-bullet">•</span>
                <span>{{ p }}</span>
              </li>
            }
          </ul>
        </div>
      }
    </div>
  </div>
</section>

<!-- ZERO TOLERANCE CALLOUT -->
<section class="section-sm zero-tolerance-section bg-light">
  <div class="container">
    <div class="card zero-tolerance-card">
      <div class="zt-icon">🛡️</div>
      <div class="zt-text">
        <h4>{{ langService.t('rules.zt_title') }}</h4>
        <p>
          {{ langService.t('rules.zt_desc') }}
        </p>
      </div>
    </div>
  </div>
</section>

<app-cta-section></app-cta-section>
