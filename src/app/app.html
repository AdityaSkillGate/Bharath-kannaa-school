<div class="app-layout">
  <!-- Sticky Header Wrapper (Topbar + Navbar) -->
  <header class="site-header-wrapper">
    <app-topbar></app-topbar>
    <app-navbar></app-navbar>
  </header>

  <!-- Routed Page View -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Global Footer -->
  <app-footer></app-footer>

  <!-- AI School Assistant Floating Chatbot (Available Across All Pages) -->
  <app-chat-assistant></app-chat-assistant>

  <!-- Toast Notifications Container -->
  @if (toasts().length > 0) {
    <div class="toast-container" aria-live="polite">
      @for (toast of toasts(); track toast.id) {
        <div class="toast-item toast-{{ toast.type }}">
          <span class="toast-icon">
            @if (toast.type === 'success') {
              <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
            } @else {
              <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>
            }
          </span>
          <span class="toast-text">{{ toast.message }}</span>
          <button type="button" class="toast-close" (click)="closeToast(toast.id)" aria-label="Close notification">&times;</button>
        </div>
      }
    </div>
  }
</div>
